<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1020"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><title>Школьный Помощник</title><style>
:root{--bg:#0e1020;--p:#171a2d;--p2:#1d2036;--t:#f6f5fb;--m:#9b9caf;--a:#8057e8;--a2:#a777ff;--ok:#43c58b;--bad:#ed6670;--b:rgba(255,255,255,.08)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#8057e82b,transparent 38%),var(--bg);color:var(--t);font:15px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{color:inherit;cursor:pointer}#app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:82px}.top{height:76px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:#0e1020d9;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#ad7cff,#6339c0);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 22px #8057e84d}.brand b{display:block;font-size:15px}.brand small{display:block;color:var(--m);font-size:11px;margin-top:2px}.icon{border:0;background:none;font-size:23px;padding:8px}.screen{padding:8px 16px 24px}.head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 13px}.head h1{font-size:25px;margin:0}.head h2{font-size:18px;margin:0}.card{background:linear-gradient(145deg,var(--p2),var(--p));border:1px solid var(--b);border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:0 8px 25px #0002}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--m)}.small{font-size:12px}.link{border:0;background:none;color:var(--a2)}.primary{width:100%;border:0;border-radius:14px;padding:13px;background:linear-gradient(135deg,var(--a2),var(--a));font-weight:800}.secondary{border:1px solid var(--b);background:var(--p);border-radius:11px;padding:9px 12px}.empty{text-align:center;padding:34px 20px;color:var(--m)}.empty b{display:block;color:var(--t);margin-bottom:6px}.bottom{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);height:76px;background:#121426f2;backdrop-filter:blur(20px);border-top:1px solid var(--b);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px max(8px,env(safe-area-inset-bottom))}.nav{border:0;background:none;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:19px}.nav small{font-size:10px}.nav.on{color:var(--a2)}.schedule{overflow:hidden;padding:0}.scheduleHead{padding:15px;border-bottom:1px solid var(--b)}.scheduleList{display:grid;gap:6px;padding:9px}.lesson{display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;background:#ffffff05;border-radius:13px;padding:10px}.num{width:29px;height:29px;border-radius:9px;background:#8057e82e;color:#c5aeff;display:grid;place-items:center;font-weight:800;font-size:12px}.lesson b{font-size:13px}.lesson small{display:block;color:var(--m);font-size:11px;margin-top:3px}.photo{border:1px dashed #ffffff2b;border-radius:17px;padding:20px;text-align:center}.photo input{display:none}.photo label{display:block}.photo .primary{margin-top:10px}.wrap{position:relative}.menu{position:absolute;right:0;top:42px;min-width:220px;background:#1a1c30;border:1px solid var(--b);border-radius:14px;padding:6px;z-index:45;box-shadow:0 18px 45px #0008}.menu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:11px}.menu button:hover{background:#fff0d}.danger{color:#ff8b92!important}.grades{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.grade{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;font-weight:800}.g5{background:#43c58b2e;color:#67dda9}.g4{background:#e8aa422b;color:#f0bd64}.g3{background:#e8aa421c;color:#e3a94f}.g2{background:#ed667026;color:#f47f87}.progress{height:6px;background:#ffffff0f;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#62dfaa)}.target{border:1px solid #8057e84d;background:#8057e812;color:#c8b7ff;border-radius:10px;padding:7px 9px}.goal{margin-top:11px;padding:11px;border-radius:12px;background:#8057e812;border:1px solid #8057e829;font-size:12px;line-height:1.45}.goal.ok{background:#43c58b12;border-color:#43c58b4d;color:#82dfb3}.item{display:flex;align-items:center;gap:11px}.subjectIcon{width:38px;height:38px;border-radius:12px;background:#8057e826;color:#ad8cff;display:grid;place-items:center}.itemMain{flex:1;min-width:0}.itemMain b{display:block;font-size:14px}.itemMain span{display:block;color:var(--m);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{width:24px;height:24px;border:1px solid #ffffff47;background:none;border-radius:8px}.check.done{background:var(--ok);border-color:var(--ok)}.check.done:after{content:'✓';font-weight:800}.form{display:grid;gap:12px}.field label{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#111427;color:var(--t);border:1px solid var(--b);border-radius:12px;padding:12px;outline:0}.field textarea{min-height:95px;resize:vertical}.theme{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.theme button,.color{border:1px solid var(--b);background:var(--p);border-radius:11px;padding:10px}.theme .sel{border-color:var(--a)}.colors{display:flex;gap:10px}.color{width:32px;height:32px;padding:0;border-radius:50%}.color.sel{box-shadow:0 0 0 3px #fff3;border-color:#fff}.setting{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--b)}.setting:last-child{border-bottom:0}.setting b{font-size:14px}.setting span{display:block;color:var(--m);font-size:12px;margin-top:3px}.switch{width:48px;height:28px;border:0;border-radius:99px;background:#3a3c50;padding:3px}.switch i{display:block;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--ok)}.switch.on i{transform:translateX(20px)}.notice{padding:12px;border-radius:13px;background:#8057e812;border:1px solid #8057e833;color:#cbbcff;font-size:12px;line-height:1.45}.notice.bad{background:#ed667012;border-color:#ed667044;color:#ff9da4}.notice.ok{background:#43c58b12;border-color:#43c58b4d;color:#82dfb3}.modalBg{position:fixed;inset:0;z-index:60;background:#0009;backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);background:#16182b;border:1px solid var(--b);border-radius:25px 25px 0 0;padding:20px;max-height:88dvh;overflow:auto}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalHead h3{margin:0}.close{border:0;background:var(--p);border-radius:9px;width:34px;height:34px}@media(min-width:760px){.modalBg{align-items:center}.modal{border-radius:25px;max-width:620px}}
</style></head><body><div id="app"><header class="top"><button class="icon" id="hamb">☰</button><div class="brand"><div class="logo">▣</div><div><b>Школьный Помощник</b><small>Твой помощник в учёбе</small></div></div><button class="icon">♧</button></header><main id="screen" class="screen"></main><nav class="bottom"><button class="nav on" data-r="home">⌂<small>Главная</small></button><button class="nav" data-r="homework">▤<small>ДЗ</small></button><button class="nav" data-r="grades">▱<small>Оценки</small></button><button class="nav" data-r="settings">⚙<small>Настройки</small></button></nav></div><div id="modal"></div><script>
const K='school-helper-v2';const DEF={profile:{name:'Ученик',className:'10А'},homework:[],grades:{},targets:{},schedule:[],scheduleAt:null,settings:{theme:'dark',accent:'#8057e8',notifications:true,sound:true,apiKey:'',geminiModel:'gemini-3.6-flash'}};let S=load(),route='home';function load(){try{return merge(DEF,JSON.parse(localStorage.getItem(K))||{})}catch{return structuredClone(DEF)}}function merge(a,b){return {...structuredClone(a),...b,profile:{...a.profile,...(b.profile||{})},settings:{...a.settings,...(b.settings||{})}}}function save(){localStorage.setItem(K,JSON.stringify(S))}function e(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}function q(a){return Math.floor(a+.5)}function date(x){return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(x+'T00:00:00'))}function sid(s){return btoa(unescape(encodeURIComponent(s))).replace(/\W/g,'').slice(0,22)||'x'}
function apply(){document.documentElement.style.setProperty('--a',S.settings.accent);let l=S.settings.theme==='light'||(S.settings.theme==='system'&&matchMedia('(prefers-color-scheme:light)').matches);let m=l?{'--bg':'#f4f3f8','--p':'#fff','--p2':'#faf9fd','--t':'#171625','--m':'#747381'}:{'--bg':'#0e1020','--p':'#171a2d','--p2':'#1d2036','--t':'#f6f5fb','--m':'#9b9caf'};Object.entries(m).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))}
function render(){apply();document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.r===route));document.getElementById('screen').innerHTML={home:home,homework:hw,grades:grades,settings:settings}[route]();bind()}
function home(){return `<div class="head"><h1>Расписание</h1><div class="wrap"><button class="icon act" data-a="schedMenu">⋮</button><div class="menu" id="schedMenu" hidden><button data-a="newSchedule">📷 Загрузить новое расписание</button>${S.schedule.length?'<button class="danger" data-a="delSchedule">Удалить расписание</button>':''}</div></div></div>${S.schedule.length?scheduleCard():scheduleEmpty()}<div class="head" style="margin-top:25px"><h2>Ближайшие задания</h2><button class="link" data-a="addHw">+ Добавить</button></div>${S.homework.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(hwCard).join('')||'<div class="card empty"><b>Домашних заданий пока нет</b>Добавь первое задание.</div>'}<div class="head" style="margin-top:25px"><h2>Средние баллы</h2><button class="link" data-r2="grades">Оценки →</button></div>${miniGrades()}`}
function scheduleEmpty(){return `<div class="card"><div class="photo"><div style="font-size:30px">📷</div><b>Загрузить расписание</b><p class="small muted">Фото таблицы → Gemini найдёт колонку класса <b>${e(S.profile.className)}</b> → уроки сразу появятся здесь.</p><label class="primary">Выбрать фото<input id="photo" type="file" accept="image/*"></label></div><div id="result"></div></div>`}
function scheduleCard(){return `<div class="card schedule"><div class="scheduleHead"><div class="row"><div><b>Расписание на сегодня</b><div class="small muted">Класс ${e(S.profile.className)}${S.scheduleAt?' · обновлено '+new Date(S.scheduleAt).toLocaleDateString('ru-RU'):''}</div></div><span class="small muted">${S.schedule.length} уроков</span></div></div><div class="scheduleList">${S.schedule.map((x,i)=>`<div class="lesson"><div class="num">${i+1}</div><div><b>${e(x.lesson||x)}</b>${x.time||x.room?`<small>${e(x.time||'')}${x.room?' · '+e(x.room):''}</small>`:''}</div></div>`).join('')}</div></div>`}
function hwCard(x){return `<div class="card"><div class="item"><div class="subjectIcon">▤</div><div class="itemMain"><b>${e(x.subject)}</b><span>${e(x.text)}</span></div><span class="small muted">${date(x.date)}</span><button class="check ${x.done?'done':''}" data-a="toggleHw" data-id="${x.id}"></button></div></div>`}
function hw(){return `<div class="head"><h1>Домашние задания</h1><button class="icon" data-a="addHw">＋</button></div>${S.homework.sort((a,b)=>a.date.localeCompare(b.date)).map(hwCard).join('')||'<div class="card empty"><b>Заданий пока нет</b>Нажми «＋» и добавь первое.</div>'}`}
function miniGrades(){let es=Object.entries(S.grades);if(!es.length)return '<div class="card empty"><b>Оценок пока нет</b>Добавляй предметы и оценки сам.</div>';return '<div class="card">'+es.slice(0,4).map(([s,g])=>{let a=avg(g);return `<div style="margin-bottom:13px"><div class="row"><span>${e(s)}</span><b>${a.toFixed(2)}</b></div><div class="progress"><i style="width:${a/5*100}%"></i></div></div>`}).join('')+'</div>'}
function grades(){let es=Object.entries(S.grades);return `<div class="head"><h1>Оценки</h1><button class="icon" data-a="addSubject">＋</button></div>${es.length?es.map(gradeCard).join(''):'<div class="card empty"><b>Предметов пока нет</b>Нажми «＋» сверху и добавь первый предмет. Никаких готовых оценок здесь нет.</div>'}`}
function need(g,t){let a=avg(g);if(q(a)>=t)return {ok:1,txt:`🎯 Уже хватает: средний <b>${a.toFixed(2)}</b> → итог <b>${q(a)}</b>.`};for(let n=1;n<=50;n++){let na=(g.reduce((x,y)=>x+y,0)+n*t)/(g.length+n);if(q(na)>=t)return {ok:0,txt:`Чтобы получить <b>${t}</b>, нужно ещё <b>${n}</b> оцен${n===1?'ку':'ки'} <b>${t}</b>. Средний станет ≈ <b>${na.toFixed(2)}</b>.`}}return {ok:0,txt:`Цель ${t} пока не достигается.`}}
function gradeCard([s,g]){let a=avg(g),t=S.targets[s]||4,n=need(g,t);return `<div class="card"><div class="row"><div><b>${e(s)}</b><div class="small muted">Итог за четверть: <b>${g.length?q(a):'—'}</b></div></div><div class="wrap"><button class="icon" data-a="gm" data-s="${e(s)}">⋮</button><div class="menu" id="gm-${sid(s)}" hidden><button data-a="addGrade" data-s="${e(s)}">＋ Добавить оценку</button><button class="danger" data-a="delSubject" data-s="${e(s)}">Удалить предмет</button></div></div></div><div class="grades">${g.map(v=>`<span class="grade g${v}">${v}</span>`).join('')||'<span class="small muted">Оценок пока нет</span>'}</div><div class="row"><span class="small muted">Средний балл</span><b>${g.length?a.toFixed(2):'—'}</b></div>${g.length?`<div class="progress"><i style="width:${a/5*100}%"></i></div>`:''}<div class="row" style="margin-top:12px"><span class="small muted">Хочу получить</span><select class="target" data-target="${e(s)}"><option value="4" ${t===4?'selected':''}>4 за четверть</option><option value="5" ${t===5?'selected':''}>5 за четверть</option></select></div>${g.length?`<div class="goal ${n.ok?'ok':''}">${n.txt}</div>`:'<div class="goal">Добавь оценки — здесь появится расчёт, что ещё нужно для выбранной цели.</div>'}</div>`}
function settings(){return `<div class="head"><h1>Настройки</h1></div><div class="card"><h3>Профиль</h3><div class="form"><div class="field"><label>Имя</label><input id="pn" value="${e(S.profile.name)}"></div><div class="field"><label>Класс</label><input id="pc" value="${e(S.profile.className)}" placeholder="10А"></div><button class="primary" data-a="saveProfile">Сохранить</button></div></div><div class="card"><h3>Внешний вид</h3><div class="theme">${[['light','☀ Светлая'],['dark','☾ Тёмная'],['system','◐ Авто']].map(x=>`<button class="${S.settings.theme===x[0]?'sel':''}" data-theme="${x[0]}">${x[1]}</button>`).join('')}</div><p class="small muted">Цвет акцента</p><div class="colors">${['#8057e8','#2878e5','#24ad80','#e8a32e','#e65d62'].map(c=>`<button class="color ${S.settings.accent===c?'sel':''}" style="background:${c}" data-color="${c}"></button>`).join('')}</div></div><div class="card"><h3>Gemini — расписание</h3><div class="notice">В запрос автоматически подставляется класс <b>${e(S.profile.className)}</b>. Поменяешь класс — следующий запрос будет искать новый класс.</div><div class="field" style="margin-top:12px"><label>Ваш Gemini API ключ</label><input id="key" type="password" value="${e(S.settings.apiKey)}" placeholder="AIza..."></div><div class="field" style="margin-top:12px"><label>Модель</label><input id="model" value="${e(S.settings.geminiModel)}" placeholder="gemini-3.6-flash"></div><button class="primary" data-a="saveApi">Сохранить Gemini</button><p class="small muted">Ключ хранится только в localStorage этого браузера и не записывается в GitHub. Для публичного сервиса лучше сделать серверный proxy.</p></div><div class="card"><h3>Прочее</h3>${setting('Уведомления','Напоминания о заданиях','notifications',S.settings.notifications)}${setting('Звуки','Звуки интерфейса','sound',S.settings.sound)}</div><div class="card"><button class="secondary" style="width:100%" data-a="reset">Сбросить все данные</button></div>`}
function setting(a,b,k,v){return `<div class="setting"><div><b>${a}</b><span>${b}</span></div><button class="switch ${v?'on':''}" data-toggle="${k}"><i></i></button></div>`}
function modal(html){const root=document.getElementById('modal');root.innerHTML=`<div class="modalBg" id="mb"><div class="modal">${html}</div></div>`;document.getElementById('mb').onclick=x=>{if(x.target.id==='mb')close()}}function close(){document.getElementById('modal').innerHTML=''}
function openHw(){modal(`<div class="modalHead"><h3>Новое домашнее задание</h3><button class="close" onclick="close()">×</button></div><div class="form"><div class="field"><label>Предмет</label><input id="hs"></div><div class="field"><label>Задание</label><textarea id="ht"></textarea></div><div class="field"><label>Дата сдачи</label><input id="hd" type="date"></div><button class="primary" id="saveH">Добавить</button></div>`);document.getElementById('hd').value=new Date().toISOString().slice(0,10);saveH.onclick=()=>{let s=document.getElementById('hs').value.trim(),t=document.getElementById('ht').value.trim();if(!s||!t||!document.getElementById('hd').value)return alert('Заполни все поля.');S.homework.push({id:Date.now(),subject:s,text:t,date:document.getElementById('hd').value,done:false});save();close();render()}}
function openSubject(){modal(`<div class="modalHead"><h3>Добавить предмет</h3><button class="close" onclick="close()">×</button></div><div class="form"><div class="field"><label>Название предмета</label><input id="ns" placeholder="Математика"></div><button class="primary" id="saveS">Добавить предмет</button></div>`);saveS.onclick=()=>{let s=document.getElementById('ns').value.trim();if(!s)return alert('Укажи предмет.');if(S.grades[s])return alert('Такой предмет уже есть.');S.grades[s]=[];S.targets[s]=4;save();close();render()}}
function openGrade(s){modal(`<div class="modalHead"><h3>Добавить оценку</h3><button class="close" onclick="close()">×</button></div><div class="form"><div class="field"><label>Предмет</label><select id="gs">${Object.keys(S.grades).map(x=>`<option ${x===s?'selected':''}>${e(x)}</option>`).join('')}</select></div><div class="field"><label>Оценка</label><select id="gv"><option>5</option><option>4</option><option>3</option><option>2</option></select></div><button class="primary" id="saveG">Добавить оценку</button></div>`);saveG.onclick=()=>{S.grades[document.getElementById('gs').value].push(+document.getElementById('gv').value);save();close();render()}}
function bind(){document.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{route=x.dataset.r;render()});document.querySelectorAll('[data-r2]').forEach(x=>x.onclick=()=>{route=x.dataset.r2;render()});document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>act(x.dataset.a,x.dataset));document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>{S.settings[x.dataset.toggle]=!S.settings[x.dataset.toggle];save();render()});document.querySelectorAll('[data-theme]').forEach(x=>x.onclick=()=>{S.settings.theme=x.dataset.theme;save();render()});document.querySelectorAll('[data-color]').forEach(x=>x.onclick=()=>{S.settings.accent=x.dataset.color;save();render()});document.querySelectorAll('[data-target]').forEach(x=>x.onchange=()=>{S.targets[x.dataset.target]=+x.value;save();render()});let p=document.getElementById('photo');if(p)p.onchange=readSchedule}
function act(a,d){if(a==='addHw')openHw();if(a==='addSubject')openSubject();if(a==='addGrade')openGrade(d.s||'');if(a==='toggleHw'){let x=S.homework.find(x=>x.id==d.id);x.done=!x.done;save();render()}if(a==='gm'){let m=document.getElementById('gm-'+sid(d.s));document.querySelectorAll('.menu').forEach(x=>{if(x!==m)x.hidden=true});m.hidden=!m.hidden}if(a==='delSubject'){if(confirm('Удалить предмет и все его оценки?')){delete S.grades[d.s];delete S.targets[d.s];save();render()}}if(a==='schedMenu'){const m=document.getElementById('schedMenu');m.hidden=!m.hidden}if(a==='newSchedule'){chooseSchedule()}if(a==='delSchedule'){if(confirm('Удалить текущее расписание?')){S.schedule=[];S.scheduleAt=null;save();render()}}if(a==='saveProfile'){S.profile.name=document.getElementById('pn').value.trim()||'Ученик';S.profile.className=document.getElementById('pc').value.trim()||'10А';save();render()}if(a==='saveApi'){S.settings.apiKey=document.getElementById('key').value.trim();S.settings.geminiModel=document.getElementById('model').value.trim()||'gemini-3.6-flash';save();alert('Настройки Gemini сохранены.');render()}if(a==='reset'&&confirm('Удалить все данные приложения?')){S=structuredClone(DEF);save();render()}}
function chooseSchedule(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=readSchedule;i.click()}
async function readSchedule(ev){let f=ev.target.files?.[0];if(!f)return;if(!S.settings.apiKey){alert('Сначала добавь Gemini API ключ в Настройки.');route='settings';render();return}let box=document.getElementById('result');if(!box){document.getElementById('screen').insertAdjacentHTML('beforeend','<div class="card"><div id="result" class="notice">⏳ Распознаю расписание…</div></div>');box=document.getElementById('result')}box.innerHTML=`<div class="notice">⏳ Gemini ищет колонку <b>${e(S.profile.className)}</b>…</div>`;try{let b64=(await b64file(f)).split(',')[1];let prompt=`Ты — точный парсер школьного расписания. На изображении таблица с расписанием разных классов. Нужен только класс "${S.profile.className}". Найди именно его колонку, не соседнюю. Пройди сверху вниз по этой колонке. Пустые ячейки пропусти. Верни ТОЛЬКО JSON-массив объектов: [{"lesson":"Математика","time":"08:30","room":"12"}]. Если времени или кабинета нет, оставь пустую строку. Никакого markdown и пояснений.`;let r=await fetch('https://generativelanguage.googleapis.com/v1beta2/interactions',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.settings.apiKey},body:JSON.stringify({model:S.settings.geminiModel||'gemini-3.6-flash',input:[{type:'text',text:prompt},{type:'image',data:b64,mime_type:f.type||'image/jpeg'}]})});let data=await r.json();if(!r.ok)throw Error(data.error?.message||('HTTP '+r.status));let raw=data.output_text||'';if(!raw&&data.steps)for(let st of data.steps)if(st.type==='model_output')for(let c of st.content||[])if(c.type==='text')raw+=c.text;raw=raw.replace(/```json|```/g,'').trim();let arr=JSON.parse(raw);if(!Array.isArray(arr))throw Error('Gemini вернул неправильный формат.');S.schedule=arr.map(x=>typeof x==='string'?{lesson:x,time:'',room:''}:{lesson:x.lesson||'',time:x.time||'',room:x.room||''}).filter(x=>x.lesson);S.scheduleAt=Date.now();save();render()}catch(err){box.innerHTML=`<div class="notice bad"><b>Не удалось распознать.</b><br>${e(err.message)}</div>`}}
function b64file(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}render();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
